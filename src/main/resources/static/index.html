<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OTT Hub - 검색 추천 & 무한 스크롤</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #141414;
            color: #ffffff;
            margin: 0;
            padding: 30px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #e50914;
            margin-bottom: 20px;
        }

        /* 탭 메뉴 */
        .tab-menu {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .tab-btn {
            background-color: #222;
            color: #aaa;
            border: 1px solid #444;
            padding: 10px 24px;
            font-size: 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.2s;
        }
        .tab-btn.active {
            background-color: #e50914;
            color: white;
            border-color: #e50914;
            font-weight: bold;
        }

        /* 구독 OTT 필터 */
        .filter-box {
            background-color: #1f1f1f;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #333;
        }
        .filter-title {
            font-size: 14px;
            font-weight: bold;
            color: #e50914;
            margin-bottom: 10px;
        }
        .my-ott-list {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        .ott-checkbox-label {
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            width: fit-content;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        /* 최근 검색어 태그 칩 */
        .recent-search-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .recent-title {
            font-size: 13px;
            color: #aaa;
        }
        .recent-chip {
            background-color: #333;
            color: #ddd;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .recent-chip:hover {
            background-color: #444;
            color: #fff;
        }
        .chip-delete {
            font-weight: bold;
            color: #888;
            cursor: pointer;
        }
        .chip-delete:hover {
            color: #e50914;
        }

        /* 검색 영역 & 자동완성 */
        .search-container {
            position: relative;
            margin-bottom: 25px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        select, input, button {
            padding: 12px 16px;
            font-size: 16px;
            border-radius: 4px;
            border: none;
        }
        select, input {
            background-color: #333;
            color: white;
        }
        input { flex: 1; }
        button {
            background-color: #e50914;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: #b81d24; }

        /* 자동완성 추천 레이어 */
        .autocomplete-list {
            position: absolute;
            top: 100%;
            left: 125px;
            right: 85px;
            background-color: #222;
            border: 1px solid #444;
            border-radius: 0 0 8px 8px;
            z-index: 100;
            max-height: 250px;
            overflow-y: auto;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .autocomplete-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid #333;
            font-size: 14px;
        }
        .autocomplete-item:hover {
            background-color: #333;
            color: #e50914;
        }

        /* 카드 목록 */
        .results {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        /* 카드 관련 스타일 수정 */
        .card {
            display: flex;
            background-color: #1f1f1f;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            position: relative; /* ✨ 자식 요소 절대 위치(absolute) 기준점 설정 */
        }
        .poster {
            width: 140px;
            height: 210px;
            object-fit: cover;
            background-color: #333;
            cursor: pointer;
        }
        .info {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .title { font-size: 20px; font-weight: bold; margin-bottom: 8px; cursor: pointer; }
        .release-date { font-size: 14px; color: #aaa; margin-bottom: 12px; }
        .overview {
            font-size: 14px;
            color: #ccc;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .ott-section { display: flex; align-items: center; gap: 10px; }
        .ott-title { font-size: 14px; font-weight: bold; color: #aaa; }
        .ott-logos { display: flex; gap: 8px; }
        .ott-logo { width: 32px; height: 32px; border-radius: 6px; }
        .no-ott { font-size: 13px; color: #777; }

        /* 무한 스크롤 센서 / 스피너 */
        .scroll-trigger {
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
            font-size: 14px;
            color: #aaa;
        }

        /* 모달 스타일 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #1f1f1f;
            width: 90%;
            max-width: 600px;
            max-height: 85vh;
            border-radius: 12px;
            padding: 25px;
            position: relative;
            overflow-y: auto;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.8);
        }
        .modal-close {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 28px;
            color: #aaa;
            cursor: pointer;
        }
        .modal-close:hover { color: white; }
        .modal-header { display: flex; gap: 20px; margin-bottom: 20px; }
        .modal-poster { width: 120px; border-radius: 8px; object-fit: cover; }
        .modal-info { flex: 1; }
        .modal-title { font-size: 22px; font-weight: bold; margin-bottom: 8px; color: #fff; }
        .modal-meta { font-size: 14px; color: #aaa; margin-bottom: 8px; }
        .modal-rating { color: #ffc107; font-weight: bold; font-size: 15px; }
        .modal-section { margin-top: 15px; border-top: 1px solid #333; padding-top: 15px; }
        .modal-section-title { font-size: 15px; font-weight: bold; color: #e50914; margin-bottom: 8px; }
        .modal-text { font-size: 14px; color: #ddd; line-height: 1.5; }

        /* 카드 헤더 행 (기존 margin-right만 약간 확보) */
        .card-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding-right: 30px; /* 오른쪽 상단 별표 버튼과 제목이 겹치지 않도록 여백 확보 */
        }
        /* ✨ [수정] 찜하기 버튼: 17px & 오른쪽 최상단 고정 */
        .star-btn {
            position: absolute;
            top: 12px;
            right: 15px;
            background: none;
            border: none;
            font-size: 17px; /* 요청하신 17px 설정 */
            cursor: pointer;
            color: #666;
            transition: transform 0.2s, color 0.2s;
            z-index: 10;
            padding: 5px;
            line-height: 1;
        }
        .star-btn.active {
            color: #ffc107; /* 찜 등록 시 활성화된 골드 색상 */
        }
        .star-btn:hover {
            transform: scale(1.2);
        }

        /* 통계 대시보드 영역 */
        .stats-container {
            display: none; /* 내 찜 목록 탭일 때만 활성화 */
            margin-bottom: 30px;
        }
        .recommendation-card {
            background: linear-gradient(135deg, #1f1f1f 0%, #2b1113 100%);
            border: 1px solid #e50914;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.2);
        }
        .recommendation-title {
            font-size: 16px;
            font-weight: bold;
            color: #e50914;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .recommendation-text {
            font-size: 15px;
            color: #ffffff;
            line-height: 1.5;
        }
        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .charts-grid { grid-template-columns: 1fr; }
        }
        .chart-card {
            background-color: #1f1f1f;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .chart-title {
            font-size: 15px;
            font-weight: bold;
            color: #ddd;
            margin-bottom: 15px;
            width: 100%;
            text-align: left;
        }
        .chart-wrapper {
            position: relative;
            width: 100%;
            max-width: 300px;
            height: 250px;
        }
    </style>

    <!-- Chart.js CDN (차트 시각화 라이브러리) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">
    <h1>🎬 어디서 볼 수 있지? (OTT Hub)</h1>

    <!-- 1. 탭 메뉴 -->
    <div class="tab-menu">
        <button class="tab-btn active" id="tabSearchBtn" onclick="switchTab('search')">🔍 OTT 검색</button>
        <button class="tab-btn" id="tabTrendingBtn" onclick="switchTab('trending')">🔥 이번 주 인기 영화</button>
        <!-- ✨ [신규] 찜 목록 탭 -->
        <button class="tab-btn" id="tabWatchlistBtn" onclick="switchTab('watchlist')">⭐ 내 찜 목록</button>
    </div>

    <!-- 2. 구독 OTT 필터 -->
    <div class="filter-box">
        <div class="filter-title">💳 내가 구독 중인 OTT 선택 (체크 시 해당 OTT 포함 작품만 표시)</div>
        <div class="my-ott-list">
            <label class="ott-checkbox-label"><input type="checkbox" class="ott-filter" value="Netflix" onchange="applyFilter()"> 넷플릭스</label>
            <label class="ott-checkbox-label"><input type="checkbox" class="ott-filter" value="Disney Plus" onchange="applyFilter()"> 디즈니+</label>
            <label class="ott-checkbox-label"><input type="checkbox" class="ott-filter" value="Wavve" onchange="applyFilter()"> 웨이브</label>
            <label class="ott-checkbox-label"><input type="checkbox" class="ott-filter" value="Watcha" onchange="applyFilter()"> 왓챠</label>
            <label class="ott-checkbox-label"><input type="checkbox" class="ott-filter" value="Coupang Play" onchange="applyFilter()"> 쿠팡플레이</label>
        </div>
    </div>

    <!-- 3. 검색 영역 & 최근 검색어 -->
    <div class="search-container" id="searchContainer">
        <!-- 최근 검색어 칩 -->
        <div class="recent-search-box" id="recentSearchBox"></div>

        <div class="search-box">
            <select id="typeSelect">
                <option value="multi">통합 (영화+TV)</option>
                <option value="movie">영화</option>
                <option value="tv">TV / 드라마</option>
            </select>
            <input type="text" id="searchInput" placeholder="검색어를 입력하세요 (예: 기생충, 무빙)" autocomplete="off">
            <button onclick="initiateNewSearch()">검색</button>
        </div>

        <!-- 실시간 자동완성 추천 레이어 -->
        <div class="autocomplete-list" id="autocompleteList"></div>
    </div>

    <!-- ✨ [신규] 내 찜 목록 스마트 통계 & 추천 대시보드 -->
    <div class="stats-container" id="statsContainer">
        <!-- 💡 OTT 인텔리전스 추천 가이드 카드 -->
        <div class="recommendation-card">
            <div class="recommendation-title">🤖 AI OTT 구독 가성비 리포트</div>
            <div class="recommendation-text" id="recommendationText">분석 중...</div>
        </div>

        <!-- 📊 시각화 차트 그리드 -->
        <div class="charts-grid">
            <div class="chart-card">
                <div class="chart-title">📺 찜한 작품의 OTT 분포</div>
                <div class="chart-wrapper">
                    <canvas id="ottChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <div class="chart-title">📊 찜한 작품 수 요약</div>
                <div class="chart-wrapper">
                    <canvas id="countChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- 4. 결과 출력 영역 -->
    <div class="results" id="resultsList"></div>

    <!-- 5. 무한 스크롤 센서 -->
    <div class="scroll-trigger" id="scrollTrigger"></div>
</div>

<!-- 모달 레이어 팝업 -->
<div class="modal-overlay" id="detailModal">
    <div class="modal-content">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <div id="modalBody">
            <p style="text-align: center;">로딩 중...</p>
        </div>
    </div>
</div>

<script>
    let currentRawData = [];  // 서버에서 누적받은 전체 데이터
    let currentTab = 'search';
    let currentPage = 1;
    let isLoading = false;
    let hasMore = true;
    let debounceTimer = null;

    // 초기화 및 이벤트 리스너 등록
    document.addEventListener('DOMContentLoaded', () => {
        renderRecentSearches();
        setupInfiniteScroll();

        // 입력창 자동완성 (Debounce 300ms)
        const searchInput = document.getElementById('searchInput');
        searchInput.addEventListener('input', (e) => {
            clearTimeout(debounceTimer);
            const query = e.target.value.trim();

            if (!query) {
                hideAutocomplete();
                return;
            }

            debounceTimer = setTimeout(() => {
                fetchAutocomplete(query);
            }, 300);
        });

        // 엔터키 검색
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                hideAutocomplete();
                initiateNewSearch();
            }
        });

        // 바깥 클릭 시 자동완성 레이어 닫기
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-container')) {
                hideAutocomplete();
            }
        });
    });

    // 탭 전환
    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tabSearchBtn').classList.toggle('active', tab === 'search');
        document.getElementById('tabTrendingBtn').classList.toggle('active', tab === 'trending');
        document.getElementById('tabWatchlistBtn').classList.toggle('active', tab === 'watchlist');

        const searchContainer = document.getElementById('searchContainer');
        const statsContainer = document.getElementById('statsContainer');
        resetState();

        if (tab === 'search') {
            searchContainer.style.display = 'block';
            statsContainer.style.display = 'none';
            document.getElementById('resultsList').innerHTML = '';
        } else if (tab === 'trending') {
            searchContainer.style.display = 'none';
            statsContainer.style.display = 'none';
            loadData();
        } else if (tab === 'watchlist') {
            // ✨ 찜 목록 탭 선택 시
            searchContainer.style.display = 'none';
            statsContainer.style.display = 'block'; // ✨ 통계 대시보드 표시
            loadWatchlistData();
            loadWatchlistStats(); // ✨ 통계 데이터 및 차트 로드
        }
    }

    // 새로운 검색 시작 (1페이지부터 초기화)
    function initiateNewSearch() {
        const query = document.getElementById('searchInput').value.trim();
        if (!query) {
            alert('검색어를 입력해주세요!');
            return;
        }
        saveRecentSearch(query);
        resetState();
        loadData();
    }

    // 상태 초기화
    function resetState() {
        currentRawData = [];
        currentPage = 1;
        hasMore = true;
        isLoading = false;
        document.getElementById('resultsList').innerHTML = '';
        document.getElementById('scrollTrigger').innerText = '';
    }

    // 데이터 호출 (검색 or 인기 영화)
    async function loadData() {
        if (isLoading || !hasMore) return;
        isLoading = true;

        const trigger = document.getElementById('scrollTrigger');
        trigger.innerText = '⏳ 데이터 로딩 중...';

        let url = '';
        if (currentTab === 'search') {
            const query = document.getElementById('searchInput').value.trim();
            const type = document.getElementById('typeSelect').value;
            let endpoint = '/api/ott/search/multi/integrated';
            if (type === 'movie') endpoint = '/api/ott/search/integrated';
            if (type === 'tv') endpoint = '/api/ott/search/tv/integrated';

            url = `${endpoint}?query=${encodeURIComponent(query)}&page=${currentPage}`;
        } else {
            url = `/api/ott/trending/movies?page=${currentPage}`;
        }

        try {
            //const response = await safeFetch(url);
            const newData = await safeFetch(url);

            if (newData.length === 0) {
                hasMore = false;
                trigger.innerText = currentPage === 1 ? '검색 결과가 없습니다.' : '모든 데이터를 불러왔습니다.';
                isLoading = false;
                return;
            }

            // 기존 데이터 배열에 추가
            currentRawData = [...currentRawData, ...newData];
            currentPage++;
            trigger.innerText = '';

            applyFilter(); // 화면 렌더링
        } catch (error) {
            console.error('Error:', error);
            trigger.innerText = '데이터를 불러오는 중 오류가 발생했습니다.';
        } finally {
            isLoading = false;
        }
    }

    // 무한 스크롤 Observer 설정
    function setupInfiniteScroll() {
        const trigger = document.getElementById('scrollTrigger');
        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && !isLoading && hasMore) {
                // 검색 탭이고 입력값이 있을 때, 또는 트렌딩 탭일 때 실행
                if (currentTab === 'trending' || document.getElementById('searchInput').value.trim()) {
                    loadData();
                }
            }
        }, { threshold: 0.1 });

        observer.observe(trigger);
    }

    // 실시간 자동완성 API 연동
    async function fetchAutocomplete(query) {
        try {
            //const response = await safeFetch(`/api/ott/search/multi/integrated?query=${encodeURIComponent(query)}&page=1`);
            const data = await safeFetch(`/api/ott/search/multi/integrated?query=${encodeURIComponent(query)}&page=1`);

            const autoList = document.getElementById('autocompleteList');
            autoList.innerHTML = '';

            if (data.length === 0) {
                hideAutocomplete();
                return;
            }

            // 상위 5개 추천
            data.slice(0, 5).forEach(item => {
                const div = document.createElement('div');
                div.className = 'autocomplete-item';
                div.innerText = item.title;
                div.onclick = () => {
                    // 원본 제목에서 [영화], [TV] 태그 제거 후 검색창 삽입
                    const cleanTitle = item.title.replace(/^\[(영화|TV)\]\s*/, '');
                    document.getElementById('searchInput').value = cleanTitle;
                    hideAutocomplete();
                    initiateNewSearch();
                };
                autoList.appendChild(div);
            });

            autoList.style.display = 'block';
        } catch (e) {
            console.error(e);
        }
    }

    function hideAutocomplete() {
        document.getElementById('autocompleteList').style.display = 'none';
    }

    // 최근 검색어 (localStorage) 관련 기능
    function getRecentSearches() {
        return JSON.parse(localStorage.getItem('recentOttSearches') || '[]');
    }

    function saveRecentSearch(keyword) {
        let searches = getRecentSearches();
        // 중복 제거
        searches = searches.filter(k => k !== keyword);
        // 맨 앞에 추가
        searches.unshift(keyword);
        // 최대 5개 유지
        if (searches.length > 5) searches.pop();

        localStorage.setItem('recentOttSearches', JSON.stringify(searches));
        renderRecentSearches();
    }

    function deleteRecentSearch(keyword, event) {
        event.stopPropagation(); // 칩 클릭 이벤트 중단
        let searches = getRecentSearches();
        searches = searches.filter(k => k !== keyword);
        localStorage.setItem('recentOttSearches', JSON.stringify(searches));
        renderRecentSearches();
    }

    function renderRecentSearches() {
        const box = document.getElementById('recentSearchBox');
        const searches = getRecentSearches();

        if (searches.length === 0) {
            box.innerHTML = '';
            return;
        }

        let html = '<span class="recent-title">최근 검색:</span>';
        searches.forEach(k => {
            html += `
                <div class="recent-chip" onclick="searchByChip('${k}')">
                    ${k}
                    <span class="chip-delete" onclick="deleteRecentSearch('${k}', event)">&times;</span>
                </div>
            `;
        });
        box.innerHTML = html;
    }

    function searchByChip(keyword) {
        document.getElementById('searchInput').value = keyword;
        initiateNewSearch();
    }

    // 구독 OTT 필터 및 화면 렌더링
    function applyFilter() {
        const resultsList = document.getElementById('resultsList');
        const checkedOtts = Array.from(document.querySelectorAll('.ott-filter:checked')).map(cb => cb.value);

        let filteredData = currentRawData;
        if (checkedOtts.length > 0) {
            filteredData = currentRawData.filter(item => {
                if (!item.ottProviders || item.ottProviders.length === 0) return false;
                return item.ottProviders.some(provider => checkedOtts.includes(provider.provider_name));
            });
        }

        resultsList.innerHTML = '';

        if (filteredData.length === 0) {
            resultsList.innerHTML = '<p style="text-align:center; color:#aaa; padding:20px;">조건에 맞는 작품이 없습니다.</p>';
            return;
        }

        filteredData.forEach(item => {
            const posterUrl = item.posterPath
                ? `https://image.tmdb.org/t/p/w500${item.posterPath}`
                : 'https://via.placeholder.com/140x210?text=No+Image';

            let ottHtml = '';
            if (item.ottProviders && item.ottProviders.length > 0) {
                const logos = item.ottProviders.map(provider =>
                    `<img class="ott-logo" src="https://image.tmdb.org/t/p/w92${provider.logo_path}" title="${provider.provider_name}" alt="${provider.provider_name}">`
                ).join('');
                ottHtml = `<div class="ott-logos">${logos}</div>`;
            } else {
                ottHtml = `<span class="no-ott">현재 제공 중인 OTT 없음</span>`;
            }

            const cleanTitle = item.title.replace(/^\[(영화|TV)\]\s*/, '');
            const mediaType = item.mediaType
                ? item.mediaType
                : (item.title.startsWith('[TV]') ? 'tv' : 'movie');
            const posterPath = item.posterPath || '';
            // ✨ 내 찜 목록 탭에 들어와 있거나, 백엔드 체크 시 active 적용
            const isActive = currentTab === 'watchlist' ? 'active' : '';

            const cardHtml = `
                <div class="card">
                    <img class="poster" src="${posterUrl}" alt="${item.title}" onclick="openModal('${mediaType}', ${item.id})">
                    <div class="info">
                        <div>
                            <div class="title" onclick="openModal('${mediaType}', ${item.id})">${item.title}</div>
                            <button class="star-btn ${isActive}" id="star-${mediaType}-${item.id}"
                            onclick="toggleWatchlist(${item.id}, '${mediaType}', '${cleanTitle}', '${posterPath}', '${item.releaseDate}', event)">
                                ★
                            </button>
                            <div class="release-date">개봉/방영일: ${item.releaseDate || '정보 없음'}</div>
                            <div class="overview">${item.overview || '줄거리 정보가 없습니다.'}</div>
                        </div>
                        <div class="ott-section">
                            <span class="ott-title">시청 가능 OTT:</span>
                            ${ottHtml}
                        </div>
                    </div>
                </div>
            `;
            resultsList.innerHTML += cardHtml;

            // 검색/트렌딩 탭일 경우 실시간 DB 체크로 별 색상 동기화 (비동기)
            if (currentTab !== 'watchlist') {
                checkAndMarkStar(item.id, mediaType);
            }
        });
    }

    // 모달 열기/닫기 로직
    async function openModal(type, id) {
        const modal = document.getElementById('detailModal');
        const modalBody = document.getElementById('modalBody');

        modal.style.display = 'flex';
        modalBody.innerHTML = '<p style="text-align:center; padding: 40px;">상세 정보 로딩 중...</p>';

        try {
            //const response = await safeFetch(`/api/ott/detail/${type}/${id}`);
            const data = await safeFetch(`/api/ott/detail/${type}/${id}`);

            const title = data.title || data.name;
            const releaseDate = data.releaseDate || data.firstAirDate || '정보 없음';
            const posterPath = data.posterPath || data.poster_path;
            const posterUrl = posterPath
                ? `https://image.tmdb.org/t/p/w500${posterPath}`
                : 'https://via.placeholder.com/120x180?text=No+Image';

            const genres = data.genres ? data.genres.map(g => g.name).join(', ') : '정보 없음';

            let director = '정보 없음';
            if (data.credits && data.credits.crew) {
                const dirObj = data.credits.crew.find(c => c.job === 'Director');
                if (dirObj) director = dirObj.name;
            }

            let castList = '정보 없음';
            if (data.credits && data.credits.cast) {
                castList = data.credits.cast.slice(0, 5).map(c => `${c.name} (${c.character || '역'})`).join(', ');
            }

            const rating = data.voteAverage ? `⭐ ${data.voteAverage.toFixed(1)} / 10` : '평점 없음';

            modalBody.innerHTML = `
                <div class="modal-header">
                    <img class="modal-poster" src="${posterUrl}" alt="${title}">
                    <div class="modal-info">
                        <div class="modal-title">${title}</div>
                        <div class="modal-meta">개봉/방영: ${releaseDate}</div>
                        <div class="modal-meta">장르: ${genres}</div>
                        <div class="modal-rating">${rating}</div>
                    </div>
                </div>
                <div class="modal-section">
                    <div class="modal-section-title">🎬 감독</div>
                    <div class="modal-text">${director}</div>
                </div>
                <div class="modal-section">
                    <div class="modal-section-title">🎭 주요 출연진</div>
                    <div class="modal-text">${castList}</div>
                </div>
                <div class="modal-section">
                    <div class="modal-section-title">📝 줄거리</div>
                    <div class="modal-text">${data.overview || '줄거리 상세 정보가 제공되지 않습니다.'}</div>
                </div>
            `;
        } catch (error) {
            console.error('Error:', error);
            modalBody.innerHTML = '<p style="text-align:center; color:red; padding: 40px;">상세 정보를 불러오는 중 오류가 발생했습니다.</p>';
        }
    }

    function closeModal() {
        document.getElementById('detailModal').style.display = 'none';
    }

    window.onclick = function(event) {
        const modal = document.getElementById('detailModal');
        if (event.target === modal) closeModal();
    }

    async function loadWatchlistData() {
        isLoading = true;
        hasMore = false; // 찜 목록은 단일 페이지로 한 번에 불러옵니다.
        const trigger = document.getElementById('scrollTrigger');
        trigger.innerText = '⭐ 찜 목록 불러오는 중...';

        try {
            //const response = await safeFetch('/api/watchlist');
            currentRawData = await safeFetch('/api/watchlist');
            console.log(currentRawData);
            if (currentRawData.length === 0) {
                trigger.innerText = '저장된 찜 목록이 없습니다. 마음에 드는 작품을 찜해 보세요!';
            } else {
                trigger.innerText = '';
            }
            applyFilter();
        } catch (error) {
            console.error('Error:', error);
            trigger.innerText = '찜 목록을 불러오는 중 오류가 발생했습니다.';
        } finally {
            isLoading = false;
        }
    }

    async function toggleWatchlist(mediaId, mediaType, title, posterPath, releaseDate, event) {
        if (event) event.stopPropagation(); // 카드 클릭(모달 열기) 이벤트 방지

        const payload = {
            mediaId: mediaId,
            mediaType: mediaType,
            title: title,
            posterPath: posterPath,
            releaseDate: releaseDate
        };

        try {
            // fetch -> safeFetch 로 교체
            const isSaved = await safeFetch('/api/watchlist/toggle', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const btn = document.getElementById(`star-${mediaType}-${mediaId}`);
            if (btn) btn.classList.toggle('active', isSaved);

            // 찜 목록 탭에서 해제한 경우 목록 다시 로드
            if (currentTab === 'watchlist') {
                loadWatchlistData();
            }
        } catch (error) {
            console.error('Error:', error);
            alert('처리 중 오류가 발생했습니다.');
        }
    }

    // ✨ [신규] 검색 결과 목록 렌더링 시 DB에 이미 저장되어 있다면 별 색상 노란색으로 활성화
    async function checkAndMarkStar(mediaId, mediaType) {
        try {
            //const res = await safeFetch(`/api/watchlist/check?mediaId=${mediaId}&mediaType=${mediaType}`);
            const isSaved = await safeFetch(`/api/watchlist/check?mediaId=${mediaId}&mediaType=${mediaType}`);
            if (isSaved) {
                const btn = document.getElementById(`star-${mediaType}-${mediaId}`);
                if (btn) btn.classList.add('active');
            }
        } catch (e) {
            console.error(e);
        }
    }

    let ottChartInstance = null;
    let countChartInstance = null;

    // ✨ 통계 API 호출 및 Chart.js 렌더링
    async function loadWatchlistStats() {
        try {
            //const response = await safeFetch('/api/watchlist/stats');
            const stats = await safeFetch('/api/watchlist/stats');

            // 1. 스마트 가이드 문구 업데이트
            document.getElementById('recommendationText').innerHTML = stats.recommendationGuide;

            if (stats.totalCount === 0) {
                if (ottChartInstance) ottChartInstance.destroy();
                if (countChartInstance) countChartInstance.destroy();
                return;
            }

            // 2. OTT 분포 파이 차트(Doughnut) 생성
            renderOttChart(stats.ottCounts);

            // 3. 찜한 작품 총수 막대 차트 생성
            renderCountChart(stats.totalCount, stats.topOttCount, stats.topOtt);
        } catch (e) {
            console.error('통계 로드 실패:', e);
        }
    }

    // OTT 도넛 차트
    function renderOttChart(ottCounts) {
        const ctx = document.getElementById('ottChart').getContext('2d');
        if (ottChartInstance) ottChartInstance.destroy(); // 기존 차트 초기화

        const labels = Object.keys(ottCounts);
        const data = Object.values(ottCounts);

        ottChartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: labels,
                datasets: [{
                    data: data,
                    backgroundColor: [
                        '#e50914', '#00d2ff', '#ffc107', '#9b51e0', '#2ed573', '#ff6b81'
                    ],
                    borderWidth: 2,
                    borderColor: '#1f1f1f'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: { color: '#ccc', font: { size: 12 } }
                    }
                }
            }
        });
    }

    // 막대 차트 (총 작품 수 vs 1위 OTT 작품 수)
    function renderCountChart(totalCount, topOttCount, topOttName) {
        const ctx = document.getElementById('countChart').getContext('2d');
        if (countChartInstance) countChartInstance.destroy();

        countChartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['전체 찜 작품', `${topOttName} 커버`],
                datasets: [{
                    label: '작품 수',
                    data: [totalCount, topOttCount],
                    backgroundColor: ['#444444', '#e50914'],
                    borderRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    x: { ticks: { color: '#ccc' }, grid: { display: false } },
                    y: { ticks: { color: '#ccc', stepSize: 1 }, grid: { color: '#333' } }
                }
            }
        });
    }

    // safeFetch 정의
    async function safeFetch(url, options = {}) {
        const response = await fetch(url, options);

        // HTTP 상태 코드가 200~299가 아니면 (400, 404, 500 등 에러라면)
        if (!response.ok) {
            // 백엔드 GlobalExceptionHandler가 보내준 ErrorResponse JSON 파싱
            const errorData = await response.json().catch(() => null);
            const errorMsg = errorData ? errorData.message : '요청 처리 중 오류가 발생했습니다.';

            // 예외를 직접 던져서 catch 블록으로 보냄!
            throw new Error(errorMsg);
        }
        return await response.json();
    }
</script>
