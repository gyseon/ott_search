name: Java & Docker CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # 1. CI Stage: 자바 테스트 및 빌드 검증
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: ☕ JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🐘 Gradle 명령 실행 권한 부여
        run: chmod +x gradlew

      - name: 🧪 JUnit 테스트 및 Gradle 빌드
        run: ./gradlew test build

  # 2. CD Stage: Docker 이미지 빌드 및 Docker Hub 레포지토리에 푸시
  docker-build-and-push:
    needs: test-and-build # 테스트 및 빌드가 성공해야만 실행됨
    runs-on: ubuntu-latest
    if: github.event_name == 'push' # push 이벤트일 때만 실행 (PR 시에는 빌드 테스트만)

    steps:
      - name: 📥 소스코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐳 Docker QEMU 설정 (멀티 아키텍처 지원)
        uses: docker/setup-qemu-action@v3

      - name: 🐳 Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏷️ Docker 태그 및 메타데이터 추출
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/ott-service-app
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: 🚀 Docker 이미지 빌드 및 Docker Hub 푸시
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Gradle build 캐시를 활용해 CI 속도 최적화
          cache-from: type=gha
          cache-to: type=gha,mode=max