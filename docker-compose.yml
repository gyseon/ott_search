#version: '3.8'

services:
  # 1. MySQL 8.0 DB 컨테이너
  mysql-db:
    image: mysql:8.0
    container_name: ott-mysql
    restart: always
    ports:
      - "3306:3306" # 내 컴퓨터 3306 포트 ➔ 컨테이너 3306 포트 연결
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword # root 계정 비밀번호
      MYSQL_DATABASE: ottdb             # 최초 생성할 DB 이름
      MYSQL_USER: ottuser               # 일반 계정 아이디
      MYSQL_PASSWORD: ottpassword       # 일반 계정 비밀번호
      TZ: Asia/Seoul
    volumes:
      - mysql_data:/var/lib/mysql       # ✨ 오타 수정 (/var/lib/mysql)

  # 2. Spring Boot 백엔드 애플리케이션 컨테이너
  ott-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ott-service-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # MySQL DB 컨테이너와 연결하기 위한 환경변수
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/ottdb?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=ottuser
      - SPRING_DATASOURCE_PASSWORD=ottpassword
      # - TMDB_API_KEY=your_tmdb_key_here
    depends_on:
      - mysql-db # ✨ DB가 먼저 켜진 후에 앱 컨테이너가 실행되도록 순서 지정!

# Docker 내부에 안전하게 보관될 실제 DB 데이터 저장소
volumes:
  mysql_data: